[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  command     = "npm run dev"
  port        = 8888
  targetPort  = 5173

# Route /api/* to Netlify Functions so the Netlify deploy (srtool.com)
# matches the Vercel deploy's URL shape. Must come BEFORE the SPA catch-all
# below — Netlify processes redirects in declaration order, first match wins.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Never HTTP-cache the SW or the HTML shell — browser must always fetch latest
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

# Long-term cache for Vite-hashed assets (safe — filenames change on every build)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
