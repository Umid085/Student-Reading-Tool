<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-heatmap">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg-heatmap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf2415;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:0.5" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="url(#bg-heatmap)" rx="12"/>
  
  <!-- Border -->
  <rect width="64" height="64" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6" rx="12"/>
  
  <!-- Inner glow circle -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3" filter="url(#glow-heatmap)"/>
  
  <!-- Icon emoji -->
  <text x="32" y="36" font-size="28" text-anchor="middle" dominant-baseline="middle" filter="url(#glow-heatmap)">💡</text>
  
  <!-- Label (optional - smaller size) -->
  <text x="32" y="56" font-size="8" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="#fbbf24" opacity="0.7">Heatmap</text>
</svg>