<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="medal-3" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#d4663f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a16244;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Medal circle -->
  <circle cx="40" cy="40" r="35" fill="url(#medal-3)" stroke="#d4663f" stroke-width="2" filter="url(#glow-3)"/>
  
  <!-- Inner glow -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="#d4663f" stroke-width="1" opacity="0.4"/>
  
  <!-- Symbol -->
  <text x="40" y="42" font-size="28" text-anchor="middle" dominant-baseline="middle" filter="url(#glow-3)">🥉</text>
  
  <!-- Rank label -->
  <text x="40" y="65" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="#d4663f" filter="url(#glow-3)">3rd</text>
</svg>