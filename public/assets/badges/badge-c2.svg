<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-c2">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg-c2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="128" cy="128" r="125" fill="url(#bg-c2)" stroke="#ec4899" stroke-width="2" opacity="0.8"/>
  
  <!-- Glow effect -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#ec4899" stroke-width="3" opacity="0.2" filter="url(#glow-c2)"/>
  
  <!-- Symbol (emoji) -->
  <text x="128" y="110" font-size="64" text-anchor="middle" dominant-baseline="middle" filter="url(#glow-c2)">👑</text>
  
  <!-- Level text -->
  <text x="128" y="165" font-size="32" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="#ec4899" filter="url(#glow-c2)">C2</text>
  
  <!-- Border -->
  <circle cx="128" cy="128" r="125" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
</svg>