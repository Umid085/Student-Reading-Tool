<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-a1">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg-a1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="128" cy="128" r="125" fill="url(#bg-a1)" stroke="#22c55e" stroke-width="2" opacity="0.8"/>
  
  <!-- Glow effect -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.2" filter="url(#glow-a1)"/>
  
  <!-- Symbol (emoji) -->
  <text x="128" y="110" font-size="64" text-anchor="middle" dominant-baseline="middle" filter="url(#glow-a1)">🌱</text>
  
  <!-- Level text -->
  <text x="128" y="165" font-size="32" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" fill="#22c55e" filter="url(#glow-a1)">A1</text>
  
  <!-- Border -->
  <circle cx="128" cy="128" r="125" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
</svg>